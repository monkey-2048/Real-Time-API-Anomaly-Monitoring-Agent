services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    env_file:
      - .env
    ports:
      - "127.0.0.1:18080:8000"
    volumes:
      - ./data:/data
    depends_on:
      - redis

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    env_file:
      - .env
    volumes:
      - ./data:/data
    depends_on:
      - redis

  scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile.scheduler
    env_file:
      - .env
    volumes:
      - ./data:/data
    depends_on:
      - redis
